name: Test and build
on: [push, pull_request]
jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v5
   - uses: actions/setup-go@v6
     with:
      go-version: '1.26.x'
   - run: make check
   - run: go test -race ./...
   - run: make compat
   - uses: acifani/setup-tinygo@v3
     with:
      tinygo-version: '0.44.0'
   - run: make smoketest
